<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Nakshi Collar &amp; Placket Detail - Warm Terracotta">
  <defs>
    <linearGradient id="bg-col-terracotta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F1EC"/>
      <stop offset="100%" stop-color="#EBDCD0"/>
    </linearGradient>
    <pattern id="fine-grid-terracotta" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8h16M8 0v16" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#bg-col-terracotta)"/>

  <!-- Close-up Garment Chest Frame -->
  <rect x="64" y="64" width="672" height="780" rx="24" fill="#7C3E29"/>
  <rect x="64" y="64" width="672" height="780" rx="24" fill="url(#fine-grid-terracotta)"/>

  <!-- Collar Band Close-Up -->
  <path d="M180 90 Q400 230 620 90 L660 175 Q400 320 140 175 Z" fill="#562818" stroke="#F0D5B1" stroke-width="3.5"/>
  <!-- Geometric Nakshi Embroidery Pattern on Collar -->
  <path d="M195 140 Q400 270 605 140" fill="none" stroke="#F0D5B1" stroke-width="2.5" stroke-dasharray="10 6"/>
  <path d="M210 158 Q400 285 590 158" fill="none" stroke="#F0D5B1" stroke-width="1.8" stroke-dasharray="4 8"/>

  <!-- Center Placket Macro -->
  <rect x="340" y="232" width="120" height="540" rx="10" fill="#562818" stroke="#F0D5B1" stroke-width="3.5"/>
  <rect x="324" y="224" width="152" height="556" rx="14" fill="none" stroke="#F0D5B1" stroke-width="2" stroke-dasharray="12 6"/>

  <!-- Diamond Nakshi Motifs down the Placket -->
  <g stroke="#F0D5B1" stroke-width="2" fill="none" opacity="0.9">
    <polygon points="400,260 422,282 400,304 378,282"/>
    <polygon points="400,380 422,402 400,424 378,402"/>
    <polygon points="400,500 422,522 400,544 378,522"/>
    <polygon points="400,620 422,642 400,664 378,642"/>
  </g>

  <!-- Detailed Matte Shell Buttons -->
  <g>
    <circle cx="400" cy="342" r="16" fill="#F0D5B1" stroke="#562818" stroke-width="3"/>
    <circle cx="395" cy="337" r="2.2" fill="#562818"/>
    <circle cx="405" cy="337" r="2.2" fill="#562818"/>
    <circle cx="395" cy="347" r="2.2" fill="#562818"/>
    <circle cx="405" cy="347" r="2.2" fill="#562818"/>

    <circle cx="400" cy="462" r="16" fill="#F0D5B1" stroke="#562818" stroke-width="3"/>
    <circle cx="395" cy="457" r="2.2" fill="#562818"/>
    <circle cx="405" cy="457" r="2.2" fill="#562818"/>
    <circle cx="395" cy="467" r="2.2" fill="#562818"/>
    <circle cx="405" cy="467" r="2.2" fill="#562818"/>

    <circle cx="400" cy="582" r="16" fill="#F0D5B1" stroke="#562818" stroke-width="3"/>
    <circle cx="395" cy="577" r="2.2" fill="#562818"/>
    <circle cx="405" cy="577" r="2.2" fill="#562818"/>
    <circle cx="395" cy="587" r="2.2" fill="#562818"/>
    <circle cx="405" cy="587" r="2.2" fill="#562818"/>
  </g>

  <!-- Caption Pill -->
  <rect x="48" y="885" width="704" height="68" rx="14" fill="#FFFFFF" opacity="0.94"/>
  <circle cx="88" cy="919" r="14" fill="#7C3E29" stroke="#F0D5B1" stroke-width="2"/>
  <text x="118" y="914" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="22" font-weight="700" fill="#141413">নকশী কলার ও প্ল্যাকেট ডিটেইল — মাটিয়া বাদামী</text>
  <text x="118" y="938" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500" fill="#4B4A46">Hand-finished Tonal Nakshi Embroidery &amp; Natural Buttons (2/3)</text>
</svg>
